<div class="flex flex-col md:flex-row">
    <div>
        <h1>Languages</h1>

        <ul class="pl-2">
            @for (lang of languages; track lang.id) {
                <li>
                    <div class="flex gap-2 items-center">
                        <icon
                            [src]="getLanguageLogo(lang.id)"
                            [alt]="lang.name"
                            [invertInDarkMode]="lang.invertInDarkMode ?? false"
                            class="h-4 aspect-square"
                        />

                        <p>{{ lang.name }}</p>
                    </div>
                </li>
            }
            <li>...and more!</li>
        </ul>
    </div>
</div>
